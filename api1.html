<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API1 Page</title>
    <link rel="stylesheet" href="estilo/estilo.css">

</head>
<body>
    <style>
        h1,p,div,form {
            padding:0px 20px 0px 20px;
        }
        #cidade{
            max-height: 200px;
            overflow-y: auto;
        }
        #cidade:hover{
            border: 1px solid #050518;
        }
    </style>
    <meu-header></meu-header>

    <h1>Previsão do Tempo</h1>
    <p>Essa página da uma previsão meteorológica de determinado município para até 6 dias.</p>
    <br>

    <form>
        Dias(obrigatório):<br><input type="number" name="days" id="days" min="1" max="6" required>
        <br>

        Nome da cidade:<br><input type="text" id="CityName" onkeyup="setSearch()"><br>
        <div id="cidade"></div><br>

    </form>
    <br>
    
    <div id="response"></div><br>
    
    <div id="previsao-card"></div>


    <meu-footer></meu-footer>

    <script src="js/APImet.js"></script>

    <script src="js/footer.js"></script>

    <script src="js/header.js"></script>

  
</body>
</html>
