<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API1 Page</title>
    <link rel="stylesheet" href="estilo/estilo.css">

</head>
<body>
    <style>
        main {flex: 1;}
        h1,p,div,form {
            padding:0px 20px 0px 20px;
        }
        #cidade{
            max-height: 200px;
            overflow-y: auto;
        }
        #cidade:hover{
            border: 1px solid #050518;
        }


        form {
            display: flex;
            flex-direction: column;
            max-width: 400px; 
            gap: 10px;       
            font-family: Arial, sans-serif;
            color: #333;
        }

        input[type="number"],
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px; 
            font-size: 16px;    
         
            transition: all 0.3s ease;
            background-color: #f9f9f9;
        }

    
        input[type="number"]:focus,
        input[type="text"]:focus {
            border-color: #050518; 
            background-color: #fff;
            box-shadow: 0 0 5px rgba(5, 5, 24, 0.2); 
            outline: none;
        }

        input[type="number"] {
            max-width: 120px;
        }

    </style>
    <meu-header></meu-header>

    <main>
    <h1>Previsão do Tempo</h1>
    <p>Essa página da uma previsão meteorológica de determinado município para até 6 dias.</p>
    <br>

    <form>
        Dias(obrigatório):<br><input type="number" name="days" id="days" min="1" max="6" required>
        
        Nome da cidade:<br><input type="text" id="CityName" onkeyup="setSearch()"><br>
        <div id="cidade"></div>

    </form>
    <br>
    
    <div id="response"></div><br>
    
    <div id="previsao-card"></div>
    </main>

    <meu-footer></meu-footer>

    <script src="js/APImet.js"></script>

    <script src="js/footer.js"></script>

    <script src="js/header.js"></script>

  
</body>
</html>
